<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>도토리 툴즈 레이아웃 실측 (임시)</title>
<style>
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:16px;color:#1F2A44}
  h1{font-size:18px}
  pre{background:#f5f7fa;border:1px solid #dde3ea;border-radius:8px;padding:12px;white-space:pre-wrap;font-size:12px}
  .frame{border:1px solid #c9d2dd;margin:8px 0 0}
</style>
</head>
<body>
<h1>도토리 툴즈 레이아웃 실측 (임시 QA)</h1>
<pre id="out">측정 중…</pre>
<div id="host"></div>
<script>
(function () {
  var CASES = [];
  ["annual-leave", "pyeong", ""].forEach(function (slug) {
    [360, 390, 1280].forEach(function (w) {
      CASES.push({ slug: slug, url: (slug ? "/" + slug + "/" : "/"), w: w, embed: false });
    });
    [360, 760].forEach(function (w) {
      CASES.push({ slug: slug, url: (slug ? "/" + slug + "/" : "/") + "?embed=1", w: w, embed: true });
    });
  });

  var host = document.getElementById("host");
  var out = document.getElementById("out");
  var lines = [];
  var i = 0;

  function measure(frame, c) {
    var d = frame.contentDocument;
    var de = d.documentElement;
    var toggles = [].slice.call(d.querySelectorAll(".nav-toggle"));
    var tops = {};
    toggles.forEach(function (b) { tops[Math.round(b.getBoundingClientRect().top)] = 1; });
    var wraps = [].slice.call(d.querySelectorAll(".table-wrap")).map(function (w) {
      return w.scrollWidth - w.clientWidth;
    });
    var tableScroll = wraps.reduce(function (m, v) { return v > m ? v : m; }, 0);
    var header = d.querySelector(".site-header");
    var v = d.querySelector(".result-value");
    return {
      key: (c.slug || "home") + " " + c.w + (c.embed ? " embed" : ""),
      pageOverflow: de.scrollWidth - de.clientWidth,
      headerH: header ? header.offsetHeight : 0,
      navRows: Object.keys(tops).length,
      tableScroll: tableScroll,
      value: v ? v.textContent.trim() : "-"
    };
  }

  function next() {
    if (i >= CASES.length) {
      out.textContent = lines.join("\n");
      document.title = "QA-READY";
      return;
    }
    var c = CASES[i++];
    var frame = document.createElement("iframe");
    frame.className = "frame";
    frame.style.width = c.w + "px";
    frame.style.height = "700px";
    host.appendChild(frame);
    frame.addEventListener("load", function () {
      setTimeout(function () {
        try {
          var m = measure(frame, c);
          lines.push(
            m.key + " | page " + m.pageOverflow + "px | header " + m.headerH +
            "px | navRows " + m.navRows + " | table " + m.tableScroll + "px | " + m.value
          );
        } catch (e) {
          lines.push(c.slug + " " + c.w + " ERROR " + e);
        }
        out.textContent = lines.join("\n");
        next();
      }, 1000);
    });
    frame.src = c.url + (c.url.indexOf("?") > -1 ? "&" : "?") + "v=" + Date.now();
  }
  next();
})();
</script>
</body>
</html>
